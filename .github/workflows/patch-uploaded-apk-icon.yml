name: Apply JIVARA TV launcher logo to uploaded APK

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/patch-uploaded-apk-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-original-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          python3 -m pip install --user pillow
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"

      - name: Download the exact APK from commit 080f30e
        run: |
          curl -fL "https://raw.githubusercontent.com/kanalnawxo/JIVARA-TV/080f30e74342e854b5dde197053530ed2f489b55/JIVARA_TV.apk" -o original.apk
          curl -fL "https://raw.githubusercontent.com/kanalnawxo/JIVARA-TV/main/APK%20LOGO.png" -o "APK LOGO.png"
          test -s original.apk
          test -s "APK LOGO.png"

      - name: Decode original APK and replace only launcher icon resources
        run: |
          apktool d -f original.apk -o decoded
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from PIL import Image

          root = "decoded"
          manifest = os.path.join(root, "AndroidManifest.xml")
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          ns = "{http://schemas.android.com/apk/res/android}"
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher")
          app.set(ns + "banner", "@drawable/tv_banner")
          # Android TV launchers may read icon/banner from the launcher activity.
          for element in app.iter():
              if element.tag.rsplit("}", 1)[-1] in ("activity", "activity-alias"):
                  element.set(ns + "icon", "@mipmap/ic_launcher")
                  element.set(ns + "roundIcon", "@mipmap/ic_launcher")
                  element.set(ns + "banner", "@drawable/tv_banner")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          from PIL import ImageOps
          source = Image.open("APK LOGO.png").convert("RGBA")
          res = os.path.join(root, "res")
          os.makedirs(os.path.join(res, "mipmap-anydpi-v26"), exist_ok=True)
          os.makedirs(os.path.join(res, "drawable-nodpi"), exist_ok=True)
          os.makedirs(os.path.join(res, "drawable-xhdpi"), exist_ok=True)
          os.makedirs(os.path.join(res, "values"), exist_ok=True)

          def make_icon(size):
              # Full-bleed square icon: fill the complete canvas, with no transparent padding.
              return ImageOps.fit(source, (size, size), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))

          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = os.path.join(res, "mipmap-" + density)
              os.makedirs(folder, exist_ok=True)
              make_icon(size).save(os.path.join(folder, "ic_launcher.png"))

          make_icon(432).save(os.path.join(res, "drawable-nodpi", "jivara_icon_foreground.png"))
          # Android TV home-screen tile banner (16:9), derived from the exact same logo.
          ImageOps.fit(source, (320, 180), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5)).save(
              os.path.join(res, "drawable-xhdpi", "tv_banner.png")
          )
          with open(os.path.join(res, "values", "jivara_icon_colors.xml"), "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="jivara_icon_background">#101010</color></resources>\n''')
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/jivara_icon_background"/><foreground android:drawable="@drawable/jivara_icon_foreground"/></adaptive-icon>\n'''
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(os.path.join(res, "mipmap-anydpi-v26", name), "w", encoding="utf-8") as f:
                  f.write(adaptive)
          PY

      - name: Rebuild the same APK package with the new launcher icon
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          apktool b --use-aapt2 --aapt "$BT/aapt2" decoded -o unsigned.apk
          "$BT/zipalign" -f -v 4 unsigned.apk aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore signing.jks -storepass "$PASS" -keypass "$PASS" -alias jivara -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JIVARA TV, OU=Android, O=JIVARA, L=Sulaymaniyah, C=IQ"
          "$BT/apksigner" sign --ks signing.jks --ks-key-alias jivara --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out JIVARA_TV_icon.apk aligned.apk
          "$BT/apksigner" verify --verbose JIVARA_TV_icon.apk
          test -s JIVARA_TV_icon.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIVARA-TV-080f30e-with-launcher-logo
          path: JIVARA_TV_icon.apk
          retention-days: 30

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: JIVARA TV v1.0.3 - Android TV Icon and Banner
          body: |
            JIVARA TV based on the exact uploaded APK from commit 080f30e.
            Launcher icon and Android TV banner were set from APK LOGO.png. The square launcher icon fills its canvas; a 16:9 banner is also provided for TV launchers.
            The APK was rebuilt and re-signed; uninstall the previous signed copy before installing this one.
          files: JIVARA_TV_icon.apk
          overwrite_files: true
