name: Patch JIVARA TV v1.0.5 fullscreen tap and movie controls

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/patch-v105-player-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source APK
        uses: actions/checkout@v4

      - name: Install APK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"

      - name: Decode and patch only the requested player behavior
        shell: bash
        run: |
          set -euo pipefail
          APK="JIVARA_TV_fixed_v1.0.5.apk"
          test -s "$APK"
          sha256sum "$APK"
          unzip -t "$APK"
          apktool d -f "$APK" -o decoded
          test -f decoded/assets/index.html
          test -f 'decoded/smali_classes3/com/jivara/tv/MainActivity$NativeBridge.smali'
          python3 - <<'PY'
          from pathlib import Path
          root = Path("decoded")
          html = root / "assets/index.html"
          s = html.read_text(encoding="utf-8")

          old = """    function updateEpisodePlayerControls() {
                  if (!episodeSeek)
                      return;
                  const duration = Number(video.duration), current = Number(video.currentTime);
                  const seekable = Number.isFinite(duration) && duration > 0;
                  episodeSeek.disabled = !seekable;
                  episodeSeek.max = seekable ? String(Math.floor(duration)) : '100';
                  if (!episodeSeek.matches(':active'))
                      episodeSeek.value = seekable ? String(Math.min(duration, Math.max(0, current || 0))) : '0';
                  episodeCurrentTime.textContent = formatEpisodeTime(current);
                  episodeDuration.textContent = seekable ? formatEpisodeTime(duration) : '--:--';
                  if (episodePlayPause)
                      episodePlayPause.textContent = video.paused ? '▶ بەردەوامکردن' : 'Ⅱ وەستاندن';
              }
              function seekEpisodeBy(delta) {
                  if (episodeMode === 'native') {
                      notifyNoSeek();
                      return;
                  }
                  try {
                      if (Number.isFinite(video.duration) && video.duration > 0)
                          video.currentTime = Math.max(0, Math.min(video.duration, (video.currentTime || 0) + delta));
                  }
                  catch (_) { }
                  updateEpisodePlayerControls();
              }
          """
          new = """    function updateEpisodePlayerControls() {
                  if (!episodeSeek)
                      return;
                  const nativePlayback = episodeMode === 'native';
                  const duration = nativePlayback ? NaN : Number(video.duration);
                  const current = nativePlayback ? NaN : Number(video.currentTime);
                  const seekable = Number.isFinite(duration) && duration > 0;
                  episodeSeek.disabled = !seekable;
                  episodeSeek.max = seekable ? String(Math.floor(duration)) : '100';
                  if (!episodeSeek.matches(':active'))
                      episodeSeek.value = seekable ? String(Math.min(duration, Math.max(0, current || 0))) : '0';
                  episodeCurrentTime.textContent = Number.isFinite(current) ? formatEpisodeTime(current) : '--:--';
                  episodeDuration.textContent = seekable ? formatEpisodeTime(duration) : '--:--';
                  if (episodePlayPause)
                      episodePlayPause.textContent = video.paused ? '▶ بەردەوامکردن' : 'Ⅱ وەستاندن';
              }
              function seekEpisodeBy(delta) {
                  if (episodeMode === 'native') {
                      try {
                          if (window.AndroidPlayer && typeof AndroidPlayer.seekBy === 'function')
                              AndroidPlayer.seekBy(Math.round(delta * 1000));
                      }
                      catch (_) { }
                      updateEpisodePlayerControls();
                      return;
                  }
                  try {
                      if (Number.isFinite(video.duration) && video.duration > 0)
                          video.currentTime = Math.max(0, Math.min(video.duration, (video.currentTime || 0) + delta));
                  }
                  catch (_) { }
                  updateEpisodePlayerControls();
              }
          """
          if s.count(old) != 1:
              raise SystemExit(f"Could not uniquely locate movie/drama controls block: {s.count(old)}")
          s = s.replace(old, new)

          delay_gate = "        if (Date.now() - lastFullscreenEnterAt < 700)\\n            return;\\n"
          if s.count(delay_gate) != 1:
              raise SystemExit(f"Could not uniquely locate fullscreen tap delay guard: {s.count(delay_gate)}")
          s = s.replace(delay_gate, "")
          timestamp = "    let lastFullscreenEnterAt = 0;\\n"
          assignment = "        if (!expanded)\\n            lastFullscreenEnterAt = Date.now();\\n"
          if s.count(timestamp) != 1 or s.count(assignment) != 1:
              raise SystemExit("Could not uniquely locate fullscreen timestamp state")
          s = s.replace(timestamp, "").replace(assignment, "")
          html.write_text(s, encoding="utf-8")

          base = root / "smali_classes3/com/jivara/tv"
          bridge = base / "MainActivity$NativeBridge.smali"
          b = bridge.read_text()
          marker = ".method public pause()V\\n"
          if b.count(marker) != 1:
              raise SystemExit("NativeBridge pause method insertion point not unique")
          method = """.method public seekBy(J)V
              .locals 2
              .annotation runtime Landroid/webkit/JavascriptInterface;
              .end annotation
              iget-object v0, p0, Lcom/jivara/tv/MainActivity$NativeBridge;->this$0:Lcom/jivara/tv/MainActivity;
              new-instance v1, Lcom/jivara/tv/MainActivity$NativeBridge$8;
              invoke-direct {v1, p0, p1, p2}, Lcom/jivara/tv/MainActivity$NativeBridge$8;-><init>(Lcom/jivara/tv/MainActivity$NativeBridge;J)V
              invoke-virtual {v0, v1}, Lcom/jivara/tv/MainActivity;->runOnUiThread(Ljava/lang/Runnable;)V
              return-void
          .end method

          """
          bridge.write_text(b.replace(marker, method + marker))

          runnable = r""".class Lcom/jivara/tv/MainActivity$NativeBridge$8;
          .super Ljava/lang/Object;
          .source "MainActivity.java"
          # interfaces
          .implements Ljava/lang/Runnable;
          .annotation system Ldalvik/annotation/EnclosingMethod;
              value = Lcom/jivara/tv/MainActivity$NativeBridge;->seekBy(J)V
          .end annotation
          .annotation system Ldalvik/annotation/InnerClass;
              accessFlags = 0x0
              name = null
          .end annotation
          .field final synthetic this$1:Lcom/jivara/tv/MainActivity$NativeBridge;
          .field final synthetic val$delta:J
          .method constructor <init>(Lcom/jivara/tv/MainActivity$NativeBridge;J)V
              .locals 0
              iput-object p1, p0, Lcom/jivara/tv/MainActivity$NativeBridge$8;->this$1:Lcom/jivara/tv/MainActivity$NativeBridge;
              iput-wide p2, p0, Lcom/jivara/tv/MainActivity$NativeBridge$8;->val$delta:J
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method
          .method public run()V
              .locals 5
              iget-object v0, p0, Lcom/jivara/tv/MainActivity$NativeBridge$8;->this$1:Lcom/jivara/tv/MainActivity$NativeBridge;
              iget-object v0, v0, Lcom/jivara/tv/MainActivity$NativeBridge;->this$0:Lcom/jivara/tv/MainActivity;
              invoke-static {v0}, Lcom/jivara/tv/MainActivity;->-$$Nest$fgetexoPlayer(Lcom/jivara/tv/MainActivity;)Landroidx/media3/exoplayer/ExoPlayer;
              move-result-object v1
              if-eqz v1, :done
              invoke-interface {v1}, Landroidx/media3/common/Player;->getCurrentPosition()J
              move-result-wide v2
              iget-wide v4, p0, Lcom/jivara/tv/MainActivity$NativeBridge$8;->val$delta:J
              add-long/2addr v2, v4
              const-wide/16 v4, 0x0
              cmp-long v0, v2, v4
              if-gez v0, :seek
              move-wide v2, v4
          :seek
              invoke-interface {v1, v2, v3}, Landroidx/media3/common/Player;->seekTo(J)V
          :done
              return-void
          .end method
          """
          (base / "MainActivity$NativeBridge$8.smali").write_text(runnable, encoding="utf-8")
          print("Patched fullscreen tap handling and native ExoPlayer seek bridge.")
          PY

      - name: Rebuild, align, sign, and verify APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          apktool b --use-aapt2 --aapt "$BT/aapt2" decoded -o unsigned.apk
          "$BT/zipalign" -f -v 4 unsigned.apk aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore signing.jks -storepass "$PASS" -keypass "$PASS" -alias jivara -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JIVARA TV, OU=Android, O=JIVARA, L=Sulaymaniyah, C=IQ"
          "$BT/apksigner" sign --ks signing.jks --ks-key-alias jivara --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out JIVARA_TV_v1.0.6_player_controls.apk aligned.apk
          "$BT/apksigner" verify --verbose JIVARA_TV_v1.0.6_player_controls.apk
          unzip -t JIVARA_TV_v1.0.6_player_controls.apk
          test -s JIVARA_TV_v1.0.6_player_controls.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: JIVARA-TV-v1.0.6-player-controls
          path: JIVARA_TV_v1.0.6_player_controls.apk
          retention-days: 30
