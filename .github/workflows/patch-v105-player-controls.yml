name: Patch JIVARA TV v1.0.5 fullscreen tap and movie controls

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/patch-v105-player-controls.yml"
      - "scripts/patch_v105_player.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source APK
        uses: actions/checkout@v4

      - name: Install APK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"

      - name: Decode and patch only the requested player behavior
        run: |
          set -euo pipefail
          APK="JIVARA_TV_fixed_v1.0.5.apk"
          test -s "$APK"
          sha256sum "$APK"
          unzip -t "$APK"
          apktool d -f "$APK" -o decoded
          test -f decoded/assets/index.html
          test -f 'decoded/smali_classes3/com/jivara/tv/MainActivity$NativeBridge.smali'
          python3 scripts/patch_v105_player.py
          grep -q 'AndroidPlayer.seekBy' decoded/assets/index.html
          grep -q 'lastFullscreenEnterAt' decoded/assets/index.html && exit 1 || true
          grep -q 'seekBy(J)V' 'decoded/smali_classes3/com/jivara/tv/MainActivity$NativeBridge.smali'
          test -s 'decoded/smali_classes3/com/jivara/tv/MainActivity$NativeBridge$8.smali'

      - name: Rebuild, align, sign, and verify APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          apktool b --use-aapt2 --aapt "$BT/aapt2" decoded -o unsigned.apk
          "$BT/zipalign" -f -v 4 unsigned.apk aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore signing.jks -storepass "$PASS" -keypass "$PASS" -alias jivara -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JIVARA TV, OU=Android, O=JIVARA, L=Sulaymaniyah, C=IQ"
          "$BT/apksigner" sign --ks signing.jks --ks-key-alias jivara --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out JIVARA_TV_v1.0.6_player_controls.apk aligned.apk
          "$BT/apksigner" verify --verbose JIVARA_TV_v1.0.6_player_controls.apk
          unzip -t JIVARA_TV_v1.0.6_player_controls.apk
          test -s JIVARA_TV_v1.0.6_player_controls.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: JIVARA-TV-v1.0.6-player-controls
          path: JIVARA_TV_v1.0.6_player_controls.apk
          retention-days: 30
