name: Restore JIVARA TV original movie and drama playback

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/patch-v105-player-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original APK
        uses: actions/checkout@v4

      - name: Verify untouched original APK
        run: |
          set -euo pipefail
          test -s JIVARA_TV_fixed_v1.0.5.apk
          unzip -t JIVARA_TV_fixed_v1.0.5.apk
          sha256sum JIVARA_TV_fixed_v1.0.5.apk
          cp JIVARA_TV_fixed_v1.0.5.apk JIVARA_TV_original_playback_restored.apk

      - name: Upload restored original APK
        uses: actions/upload-artifact@v4
        with:
          name: JIVARA-TV-original-movie-drama-playback
          path: JIVARA_TV_original_playback_restored.apk
          retention-days: 30
