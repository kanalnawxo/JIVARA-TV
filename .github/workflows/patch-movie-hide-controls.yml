name: JIVARA TV hide all Film video controls

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/patch_movie_hide_controls.py"
      - ".github/workflows/patch-movie-hide-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install APK tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools curl
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o /usr/local/bin/apktool.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version
          command -v aapt2
          command -v zipalign
          command -v apksigner

      - name: Decode current v1.0.5 and remove Film controls only
        run: |
          set -euo pipefail
          test -s JIVARA_TV_fixed_v1.0.5.apk
          sha256sum JIVARA_TV_fixed_v1.0.5.apk
          unzip -t JIVARA_TV_fixed_v1.0.5.apk
          apktool d -f JIVARA_TV_fixed_v1.0.5.apk -o decoded
          python3 scripts/patch_movie_hide_controls.py
          grep -n "setMovieControls" decoded/smali_classes3/com/jivara/tv/MainActivity\$NativeBridge.smali
          grep -n -A7 "function playChannel" decoded/assets/index.html

      - name: Rebuild, align, and sign APK
        run: |
          set -euo pipefail
          apktool b --use-aapt2 decoded -o JIVARA_TV_fixed_v1.0.5_film_controls_removed_unsigned.apk
          zipalign -p -f 4 JIVARA_TV_fixed_v1.0.5_film_controls_removed_unsigned.apk JIVARA_TV_fixed_v1.0.5_film_controls_removed_aligned.apk
          keytool -genkeypair -v -keystore jivara-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JIVARA TV, OU=Android, O=JIVARA, L=Sulaymaniyah, ST=Kurdistan, C=IQ"
          apksigner sign --ks jivara-debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out JIVARA_TV_fixed_v1.0.5_film_controls_removed.apk JIVARA_TV_fixed_v1.0.5_film_controls_removed_aligned.apk
          apksigner verify --verbose JIVARA_TV_fixed_v1.0.5_film_controls_removed.apk
          unzip -t JIVARA_TV_fixed_v1.0.5_film_controls_removed.apk
          sha256sum JIVARA_TV_fixed_v1.0.5_film_controls_removed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIVARA-TV-v1.0.5-film-controls-removed
          path: JIVARA_TV_fixed_v1.0.5_film_controls_removed.apk
          retention-days: 30
