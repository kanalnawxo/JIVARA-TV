name: Build JIVARA TV with logo icon only

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-jivara-logo-splash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Android APK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          python3 -m pip install --user pillow
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"

      - name: Decode the original working JIVARA APK
        run: |
          cp JIVARA_TV.zip original.apk
          cp "APK LOGO.png" logo.png
          apktool d -f original.apk -o decoded

      - name: Replace launcher artwork only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image, ImageOps

          root = Path("decoded")
          res = root / "res"
          logo = Path("logo.png")
          manifest = root / "AndroidManifest.xml"

          # Change only the application launcher icon references.
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          ns = "{http://schemas.android.com/apk/res/android}"
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Use the supplied LOGO.png as the sole source for every launcher density.
          with Image.open(logo) as image:
              source = image.convert("RGBA")
              for density, size in [
                  ("mdpi", 48), ("hdpi", 72), ("xhdpi", 96),
                  ("xxhdpi", 144), ("xxxhdpi", 192)
              ]:
                  folder = res / ("mipmap-" + density)
                  folder.mkdir(parents=True, exist_ok=True)
                  source.resize((size, size), Image.Resampling.LANCZOS).save(
                      folder / "ic_launcher.png", format="PNG", optimize=True
                  )

              # Android adaptive icon: same logo artwork, no extra splash or app code.
              foreground = res / "drawable-nodpi" / "jivara_icon_foreground.png"
              foreground.parent.mkdir(parents=True, exist_ok=True)
              source.resize((432, 432), Image.Resampling.LANCZOS).save(
                  foreground, format="PNG", optimize=True
              )

          adaptive_dir = res / "mipmap-anydpi-v26"
          adaptive_dir.mkdir(parents=True, exist_ok=True)
          background_dir = res / "drawable"
          background_dir.mkdir(parents=True, exist_ok=True)
          (background_dir / "jivara_icon_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android">'
              '<solid android:color="#101010"/></shape>\n',
              encoding="utf-8"
          )
          adaptive = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@drawable/jivara_icon_background"/>'
              '<foreground android:drawable="@drawable/jivara_icon_foreground"/>'
              '</adaptive-icon>\n'
          )
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (adaptive_dir / name).write_text(adaptive, encoding="utf-8")
          PY

      - name: Rebuild and sign APK without changing app code
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          apktool b --use-aapt2 --aapt "$BT/aapt2" decoded -o unsigned.apk
          "$BT/zipalign" -f -v 4 unsigned.apk aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore signing.jks -storepass "$PASS" -keypass "$PASS" -alias jivara -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JIVARA TV, OU=Android, O=JIVARA, L=Sulaymaniyah, C=IQ"
          "$BT/apksigner" sign --ks signing.jks --ks-key-alias jivara --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out JIVARA_TV_logo_icon_only.apk aligned.apk
          "$BT/apksigner" verify --verbose JIVARA_TV_logo_icon_only.apk
          test -s JIVARA_TV_logo_icon_only.apk

      - name: Upload icon-only APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIVARA-TV-logo-icon-only
          path: JIVARA_TV_logo_icon_only.apk
          retention-days: 30
