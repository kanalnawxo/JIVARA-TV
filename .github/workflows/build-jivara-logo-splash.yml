name: Build JIVARA TV with native 5-second startup splash

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-jivara-logo-splash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Android APK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          python3 -m pip install --user pillow
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" "platforms;android-35"

      - name: Decode the original JIVARA APK
        run: |
          cp JIVARA_TV.zip original.apk
          cp "APK LOGO.png" logo.png
          apktool d -f original.apk -o decoded
          echo "Original dex files:"
          unzip -l original.apk | grep -E 'classes[0-9]*\.dex' || true

      - name: Create native splash activity, logo resources, and startup sound
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image

          root = Path("decoded")
          res = root / "res"
          source_logo = Image.open("logo.png").convert("RGBA")

          # Crop the black side padding so the supplied artwork fills the splash and launcher assets.
          rgb = source_logo.convert("RGB")
          mask = rgb.point(lambda p: 255 if p > 28 else 0)
          bbox = mask.getbbox()
          if bbox:
              source_logo = source_logo.crop(bbox)
          splash_dir = res / "drawable-nodpi"
          splash_dir.mkdir(parents=True, exist_ok=True)
          source_logo.save(splash_dir / "jivara_splash_logo.png", format="PNG", optimize=True)

          # Square launcher artwork, tightly cropped from the same original logo.
          side = min(source_logo.width, source_logo.height)
          left = max(0, source_logo.width - side)
          top = max(0, (source_logo.height - side) // 2)
          icon_logo = source_logo.crop((left, top, left + side, top + side)).resize((1024,1024), Image.Resampling.LANCZOS)
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = res / ("mipmap-" + density)
              folder.mkdir(parents=True, exist_ok=True)
              icon_logo.resize((size,size), Image.Resampling.LANCZOS).save(folder / "ic_launcher.png", format="PNG", optimize=True)
          fg = res / "drawable-nodpi" / "jivara_icon_foreground.png"
          icon_logo.resize((432,432), Image.Resampling.LANCZOS).save(fg, format="PNG", optimize=True)
          banner = Image.new("RGBA",(320,180),(16,16,16,255))
          fitted = source_logo.copy()
          fitted.thumbnail((316,176),Image.Resampling.LANCZOS)
          banner.alpha_composite(fitted,((320-fitted.width)//2,(180-fitted.height)//2))
          banner.save(res / "drawable-nodpi" / "jivara_tv_banner.png",format="PNG",optimize=True)

          # Move launcher intent to a dedicated native SplashActivity; MainActivity remains intact.
          manifest = root / "AndroidManifest.xml"
          tree = ET.parse(manifest); mr = tree.getroot()
          ns_uri = "http://schemas.android.com/apk/res/android"
          A = lambda name: "{%s}%s" % (ns_uri,name)
          app = mr.find("application")
          if app is None: raise SystemExit("Missing application element")
          main = None
          for act in list(app.findall("activity")):
              if act.get(A("name")) == "com.jivara.tv.MainActivity":
                  main = act
          if main is None: raise SystemExit("MainActivity not found")
          for filt in list(main.findall("intent-filter")):
              actions = [x.get(A("name")) for x in filt.findall("action")]
              cats = [x.get(A("name")) for x in filt.findall("category")]
              if "android.intent.action.MAIN" in actions:
                  main.remove(filt)
          splash = ET.SubElement(app,"activity",{
              A("name"):"com.jivara.tv.JivaraSplashActivity",
              A("exported"):"true",
              A("screenOrientation"):"landscape",
              A("theme"):"@style/AppTheme"
          })
          filt = ET.SubElement(splash,"intent-filter")
          ET.SubElement(filt,"action",{A("name"):"android.intent.action.MAIN"})
          ET.SubElement(filt,"category",{A("name"):"android.intent.category.LAUNCHER"})
          ET.SubElement(filt,"category",{A("name"):"android.intent.category.LEANBACK_LAUNCHER"})
          app.set(A("icon"),"@mipmap/ic_launcher")
          app.set(A("roundIcon"),"@mipmap/ic_launcher")
          app.set(A("banner"),"@drawable/jivara_tv_banner")
          tree.write(manifest,encoding="utf-8",xml_declaration=True)

          # Native Activity: show the image immediately, play sound, then open MainActivity after 5 sec.
          java = Path("JivaraSplashActivity.java")
          java.write_text(r"""
          package com.jivara.tv;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Intent;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.ImageView;

          public final class JivaraSplashActivity extends Activity {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private Runnable launchTask;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().setBackgroundDrawableResource(android.R.color.black);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(8,8,8));
                  ImageView logo = new ImageView(this);
                  int imageId = getResources().getIdentifier("jivara_splash_logo","drawable",getPackageName());
                  if (imageId != 0) logo.setImageResource(imageId);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  int w = getResources().getDisplayMetrics().widthPixels;
                  int h = getResources().getDisplayMetrics().heightPixels;
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams((int)(w*.92f),(int)(h*.94f),Gravity.CENTER);
                  root.addView(logo,lp);
                  setContentView(root);
                  launchTask = new Runnable() {
                      @Override public void run() {
                          Intent intent = new Intent();
                          intent.setClassName(JivaraSplashActivity.this,"com.jivara.tv.MainActivity");
                          startActivity(intent);
                          finish();
                      }
                  };
                  handler.postDelayed(launchTask,5000L);
              }
              @Override protected void onDestroy() {
                  if (launchTask != null) handler.removeCallbacks(launchTask);
                  super.onDestroy();
              }
          }
          """,encoding="utf-8")
          PY

      - name: Compile native splash activity to dex
        run: |
          mkdir -p java-classes dex-out
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d java-classes JivaraSplashActivity.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --min-api 21 --output dex-out java-classes/com/jivara/tv/*.class
          test -s dex-out/classes.dex

      - name: Rebuild, add native activity dex, and sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          apktool b --use-aapt2 --aapt "$BT/aapt2" decoded -o unsigned.apk
          # Add the compiled activity as the next multidex file.
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path("unsigned.apk")
          dex=Path("dex-out/classes.dex")
          with zipfile.ZipFile(apk,"a") as z:
              names=set(z.namelist())
              i=2
              while f"classes{i}.dex" in names: i+=1
              z.write(dex,f"classes{i}.dex")
          PY
          "$BT/zipalign" -f -v 4 unsigned.apk aligned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore signing.jks -storepass "$PASS" -keypass "$PASS" -alias jivara -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JIVARA TV, OU=Android, O=JIVARA, L=Sulaymaniyah, C=IQ"
          "$BT/apksigner" sign --ks signing.jks --ks-key-alias jivara --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out JIVARA_TV_native_splash.apk aligned.apk
          "$BT/apksigner" verify --verbose JIVARA_TV_native_splash.apk
          unzip -l JIVARA_TV_native_splash.apk | grep -E 'classes[0-9]*\.dex|res/drawable-nodpi/jivara_splash_logo.png|res/raw/jivara_intro.wav'

      - name: Upload native splash APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIVARA-TV-native-5-second-splash
          path: JIVARA_TV_native_splash.apk
          retention-days: 30
